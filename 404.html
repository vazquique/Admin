<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Página no encontrada — Panel Idóneo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#182644; --brass-light:#d9ab52; --parchment:#f1ead8; --line: rgba(241,234,216,0.18); --line-strong: rgba(241,234,216,0.32);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--parchment); font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
  .code{font-family:'IBM Plex Mono', monospace; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.14em; color:var(--brass-light); margin-bottom:18px;}
  h1{font-family:'Newsreader', serif; font-size:1.8rem; font-weight:500;}
  p{margin-top:14px; color:rgba(241,234,216,0.72); max-width:40ch; margin-left:auto; margin-right:auto;}
  a{display:inline-flex; margin-top:28px; background:var(--brass-light); color:var(--ink); text-decoration:none;
    padding:13px 26px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.07em;}
</style>
</head>
<body>
  <div>
    <div class="code">Error 404</div>
    <h1>Página no encontrada.</h1>
    <p>Esta ruta no existe en el panel de administración.</p>
    <a href="index.html">Ir al panel</a>
  </div>
</body>
</html>
